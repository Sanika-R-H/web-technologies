<!DOCTYPE html>
<html lang="en">
<head>
    <title>Passport Seva Registration</title>
</head>
<body>
<div >
    <h2>User Registration</h2>
    <form>
        <label>Register to apply at</label>
        <pre>
            <input type="radio" name="apply"> CPV Delhi<br/>
            <input type="radio" name="apply"> Passport Office
        </pre>
        <label>Passport Office</label>
        <select>
            <option>---- Select ----</option>
            <option>Bangalore</option>
            <option>Delhi</option>
            <option>Mumbai</option>
        </select><br/><br/>

        <label>Given Name</label><input type="text" ><br/><br/>

        <label>Surname</label><input type="text"><br/><br/>

        <label>Date of Birth</label><input type="date"><br/><br/>

 <label>Email id</label><input type="email"><br/><br/>

        <label>Do you want your Login ID to be same as E-mail ID?</label>
            <input type="radio" name="sameEmail"> Yes
           <input type="radio" name="sameEmail"> No <br/><br/>

        <label>Login ID</label> <input type="text">Check Availability<br/><br/>

        <label>Password</label><input type="password">Password Policy<br/><br/>

        <label>Confirm Password</label> <input type="password"><br/><br/>

        <label>Hint Question</label>
        <select>
            <option>---- Select ----</option>
            <option>Your pet name?</option>
            <option>Your school name?</option>
        </select><br/><br/>

        <label>Hint Answer</label> <input type="text"><br/><br/>

        <label>Enter Characters Displayed</label>
        <div>WHRS6J4</div>
        <input type="text">Change the Characters Displayed<br/><br/>

        <button type="submit">Register</button>
         <button type="submit">Clear</button>
    </form>
</div>
</body>
</html>
